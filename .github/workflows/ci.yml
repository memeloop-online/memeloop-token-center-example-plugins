name: verify

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Verify release descriptor publisher syntax
        run: node --check scripts/publish-release-descriptor.mjs
      - name: Verify typed API and fixtures
        run: npm run check
      - name: Set up pinned Rust component toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
      - name: Build and execute the real service-data component
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown -p mtc-health-component
          cargo run --locked --release -p health-componentize
          cargo run --locked --release -p health-host-harness --bin health-host-harness
          node scripts/verify-component.mjs
      - name: Check out the current MTC host contract
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: memeloop-online/memeloop-token-center
          ref: 0e81b1d895effae0560bb8cd2ce1a6dc36281d2d
          path: mtc-core
          persist-credentials: false
      - name: Check out the pinned installer contract
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: memeloop-online/memeloop-token-center
          ref: b1b0a01d2adcae6f94d7c51a228ff249a65cfdd3
          path: mtc-installer-contract
          fetch-depth: 0
          persist-credentials: false
      - name: Verify manifest against the host and installer contracts
        run: |
          test "$(node -p "require('./release/installer-trust.json').installer_source_revision")" = \
            "$(git -C "$GITHUB_WORKSPACE/mtc-installer-contract" rev-parse HEAD)"
          minimum_revision=$(node -p "require('./release/installer-trust.json').minimum_installer_contract_revision")
          git -C "$GITHUB_WORKSPACE/mtc-installer-contract" merge-base --is-ancestor \
            "$minimum_revision" \
            b1b0a01d2adcae6f94d7c51a228ff249a65cfdd3
          node scripts/verify-static.mjs \
            "$GITHUB_WORKSPACE/mtc-core" \
            "$GITHUB_WORKSPACE/mtc-installer-contract"
          cargo run --locked --release -p health-host-harness --bin health-contract-verify -- \
            "$GITHUB_WORKSPACE/mtc-core" "$GITHUB_WORKSPACE/mtc-installer-contract"
      - name: Create review package
        run: npm pack --ignore-scripts --pack-destination dist
      - name: Upload review package
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: mtc-health-intelligence-${{ github.sha }}
          path: |
            dist/*.tgz
            plugin.wasm
            plugin.json
            component-build.json
            component-bounds.json
            Cargo.lock
          if-no-files-found: error
          retention-days: 14
