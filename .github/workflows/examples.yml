name: verify example guests
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        guest: [model-guard, preferred-account, soonest-reset]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
      - name: Format, test and build standalone guest
        env:
          GUEST: ${{ matrix.guest }}
        run: |
          cargo fmt --manifest-path "plugin-sources/$GUEST/Cargo.toml" -- --check
          cargo test --locked --manifest-path "plugin-sources/$GUEST/Cargo.toml"
          cargo build --locked --release --target wasm32-unknown-unknown --manifest-path "plugin-sources/$GUEST/Cargo.toml"
