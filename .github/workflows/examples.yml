name: verify example guests
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        guest: [model-guard, preferred-account, soonest-reset]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify strategy schema presentation contracts
        run: node scripts/verify-strategy-schema.mjs
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          components: rustfmt
          targets: wasm32-unknown-unknown
      - name: Format, test and build standalone guest
        env:
          GUEST: ${{ matrix.guest }}
        run: |
          cargo fmt --manifest-path "plugin-sources/$GUEST/Cargo.toml" -- --check
          cargo test --locked --manifest-path "plugin-sources/$GUEST/Cargo.toml"
          cargo build --locked --release --target wasm32-unknown-unknown --manifest-path "plugin-sources/$GUEST/Cargo.toml"

  quota-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Install pinned browser review dependencies
        run: |
          npm install --no-save --package-lock=false react@19.2.8 react-dom@19.2.8 @fluentui/react-components@9.74.7 playwright@1.62.1 esbuild@0.25.12
          npx playwright install --with-deps chromium
      - name: Review quota management in Chromium
        run: node plugin-sources/soonest-reset/ui/browser-review.mjs
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        if: always()
        with:
          name: quota-management-browser-${{ github.sha }}
          path: dist/quota-management-browser/
          if-no-files-found: warn
