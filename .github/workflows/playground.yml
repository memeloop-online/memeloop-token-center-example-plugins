name: verify playground package
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: playground-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - name: Preserve playground dependency lock for source review
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: playground-dependency-lock-${{ github.sha }}
          path: playground/package-lock.json
          if-no-files-found: error
          retention-days: 30
      - name: Install playground dependencies from lockfile
        run: npm ci --prefix playground --ignore-scripts --legacy-peer-deps
      - name: Verify orchestration, model selection, core inference and image handling
        run: npm run test:playground
      - name: Build self-contained installable review package
        run: npm run build:playground
      - name: Preserve package, manifest and digest evidence
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: mtc-text-playground-${{ github.sha }}
          path: dist/playground/
          if-no-files-found: error
          retention-days: 30
      - name: Install pinned host UI and browser test dependencies in CI
        run: |
          npm install --no-save --package-lock=false react@19.2.8 react-dom@19.2.8 @fluentui/react-components@9.74.7 playwright@1.62.1 esbuild@0.25.12
          npx playwright install --with-deps chromium
      - name: Exercise the bundled plugin with real React and Fluent in Chromium
        run: npm run test:playground:browser
      - name: Preserve browser review evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: playground-browser-${{ github.sha }}
          path: dist/playground-browser/
          if-no-files-found: warn
          retention-days: 30
