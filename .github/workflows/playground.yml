name: verify playground package
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: playground-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - name: Verify agent orchestration and tool authority
        run: node --test playground/agent-loop.test.mjs
      - name: Build self-contained installable review package
        run: npm run build:playground
      - name: Preserve package, manifest and digest evidence
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: mtc-text-playground-${{ github.sha }}
          path: dist/playground/
          if-no-files-found: error
          retention-days: 30
