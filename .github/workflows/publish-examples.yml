name: verify and publish example plugins

on:
  pull_request:
    paths:
      - '.github/workflows/publish-examples.yml'
      - 'scripts/*publication*'
      - 'scripts/verify-policy-rewrite.mjs'
      - 'release/examples-*.json'
      - 'plugin-sources/soonest-reset/**'
      - 'plugin-sources/model-guard/**'
      - 'plugin-sources/preferred-account/**'
      - 'scripts/publish-release-descriptor.mjs'
      - 'plugins/google-antigravity/**'
      - 'examples/plugins/policy-rewrite/**'
      - 'wit/**'
      - 'LICENSE'
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-examples.yml'
      - 'scripts/*publication*'
      - 'scripts/verify-policy-rewrite.mjs'
      - 'release/examples-*.json'
      - 'plugin-sources/soonest-reset/**'
      - 'plugin-sources/model-guard/**'
      - 'plugin-sources/preferred-account/**'
      - 'scripts/publish-release-descriptor.mjs'
      - 'plugins/google-antigravity/**'
      - 'examples/plugins/policy-rewrite/**'
      - 'wit/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: example-plugins-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify exact examples in the real host
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Check out the reviewed example sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - name: Verify successful immutable official host and installer CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/example-publication.mjs resolve
      - name: Verify published digests against the reviewed official metadata
        run: node scripts/example-publication.mjs verify-pins
      - name: Check out the immutable compatible host
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: memeloop-online/memeloop-token-center
          ref: ${{ env.HOST_SOURCE_REVISION }}
          path: .publication-host
          persist-credentials: false
      - name: Check out the host's immutable supporting fixtures
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: memeloop-online/memeloop-token-center-example-plugins
          ref: ${{ env.HOST_FIXTURE_REVISION }}
          path: .publication-host/.plugin-examples
          persist-credentials: false
      - name: Verify checkout revisions and exact WIT contract
        run: |
          test "$(git -C .publication-host rev-parse HEAD)" = "$HOST_SOURCE_REVISION"
          test "$(git -C .publication-host/.plugin-examples rev-parse HEAD)" = "$HOST_FIXTURE_REVISION"
          cmp wit/token-center.wit .publication-host/wit/token-center.wit
          # The host is a standalone crate, outside this repository's Cargo
          # workspace. Preserve its immutable checkout instead of editing either
          # Cargo.toml to manufacture workspace membership.
          mv .publication-host "$RUNNER_TEMP/example-publication-host"
      - name: Set up the locked guest and host toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
      - name: Install checksum-pinned component tooling
        run: |
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/bytecodealliance/wasm-tools/releases/download/v1.252.0/wasm-tools-1.252.0-x86_64-linux.tar.gz \
            --output "$RUNNER_TEMP/wasm-tools.tar.gz"
          echo '097b1181d5b2bc3f2ebc44b4e72edf18308902023f1f1483a1a7dc1268ea988d  '"$RUNNER_TEMP/wasm-tools.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/example-tools" "$RUNNER_TEMP/example-components"
          tar -xzf "$RUNNER_TEMP/wasm-tools.tar.gz" -C "$RUNNER_TEMP/example-tools" --strip-components=1
          echo "$RUNNER_TEMP/example-tools" >> "$GITHUB_PATH"
      - name: Test and build the exact quota-routing guest
        run: |
          cargo test --locked --manifest-path plugin-sources/model-guard/Cargo.toml
          cargo test --locked --manifest-path plugin-sources/preferred-account/Cargo.toml
          cargo build --locked --release --target wasm32-unknown-unknown --manifest-path plugin-sources/preferred-account/Cargo.toml
          wasm-tools component new plugin-sources/preferred-account/target/wasm32-unknown-unknown/release/mtc_preferred_account.wasm -o "$RUNNER_TEMP/example-components/preferred-account.wasm"
          cargo build --locked --release --target wasm32-unknown-unknown --manifest-path plugin-sources/model-guard/Cargo.toml
          wasm-tools component new plugin-sources/model-guard/target/wasm32-unknown-unknown/release/mtc_model_guard.wasm -o "$RUNNER_TEMP/example-components/model-guard.wasm"
          cargo test --locked --manifest-path plugin-sources/soonest-reset/Cargo.toml
          cargo build --locked --release --target wasm32-unknown-unknown --manifest-path plugin-sources/soonest-reset/Cargo.toml
          wasm-tools component new plugin-sources/soonest-reset/target/wasm32-unknown-unknown/release/mtc_soonest_reset.wasm \
            -o "$RUNNER_TEMP/example-components/soonest-reset.wasm"
          wasm-tools validate --features component-model "$RUNNER_TEMP/example-components/soonest-reset.wasm"
      - name: Build and exercise the policy fixture ABI from auditable WAT
        run: |
          wasm-tools parse examples/plugins/policy-rewrite/plugin.wat -o "$RUNNER_TEMP/example-components/policy-rewrite.core.wasm"
          node scripts/verify-policy-rewrite.mjs "$RUNNER_TEMP/example-components/policy-rewrite.core.wasm"
          wasm-tools component embed wit/token-center.wit --world plugin \
            "$RUNNER_TEMP/example-components/policy-rewrite.core.wasm" \
            -o "$RUNNER_TEMP/example-components/policy-rewrite.embedded.wasm"
          wasm-tools component new "$RUNNER_TEMP/example-components/policy-rewrite.embedded.wasm" \
            -o "$RUNNER_TEMP/example-components/policy-rewrite.wasm"
          wasm-tools validate --features component-model "$RUNNER_TEMP/example-components/policy-rewrite.wasm"
          node scripts/example-publication.mjs candidate
          # Exact signed release's component, only for synthetic CI reproduction.
          curl --fail --location --retry 3 --max-time 120 \
            https://raw.githubusercontent.com/memeloop-online/memeloop-token-center-example-plugins/5a3cbcae186e90b63929cde518e29e6c86aac54b/examples/plugins/policy-rewrite/plugin.wasm \
            --output "$RUNNER_TEMP/example-components/policy-rewrite-before-growth.wasm"
          echo '99a31075d093d288367f0efd223c7a1b65c92d3dc79fb73fce765235d290992d  '"$RUNNER_TEMP/example-components/policy-rewrite-before-growth.wasm" | sha256sum --check
      - name: Preserve compiled policy candidate before host acceptance
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: policy-rewrite-component-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/example-components/policy-rewrite.wasm
            ${{ runner.temp }}/example-components/policy-rewrite-candidate.json
            ${{ runner.temp }}/example-components/model-guard.wasm
            ${{ runner.temp }}/example-components/policy-rewrite-before-growth.wasm
          if-no-files-found: error
          retention-days: 90
      # Candidate upload intentionally precedes this gate. The first source-only
      # change fails here until its exact CI artifact is checked in; it is never
      # called a passing publication/acceptance run.
      - name: Require checked-in policy binary to match the CI build
        run: cmp examples/plugins/policy-rewrite/plugin.wasm "$RUNNER_TEMP/example-components/policy-rewrite.wasm"
      - name: Assemble the three fixed packages
        run: |
          node scripts/example-publication.mjs assemble
          mkdir -p "$RUNNER_TEMP/model-guard-fixture"
          cp plugin-sources/model-guard/plugin.json "$RUNNER_TEMP/model-guard-fixture/plugin.json"
          cp "$RUNNER_TEMP/example-components/model-guard.wasm" "$RUNNER_TEMP/model-guard-fixture/plugin.wasm"
      - name: Verify provider schemas and policy behavior in the actual host
        working-directory: ${{ runner.temp }}/example-publication-host
        env:
          MTC_EXAMPLE_PUBLICATION_ROOT: ${{ github.workspace }}/dist/examples/packages
          MTC_EXAMPLE_MODEL_GUARD_PACKAGE: ${{ runner.temp }}/model-guard-fixture
          MTC_EXAMPLE_PRE_GROWTH_POLICY_COMPONENT: ${{ runner.temp }}/example-components/policy-rewrite-before-growth.wasm
        run: |
          cp "$GITHUB_WORKSPACE/scripts/example-publication-host.rs" tests/example_publication.rs
          cargo test --locked --all-features --test example_publication
      - name: Verify quota-routing guest and gateway with native health safety
        working-directory: ${{ runner.temp }}/example-publication-host
        env:
          MTC_SOONEST_RESET_PACKAGE: ${{ github.workspace }}/dist/examples/packages/mtc-soonest-reset
          MTC_MODEL_GUARD_PACKAGE: ${{ github.workspace }}/dist/examples/packages/mtc-model-guard
          MTC_PREFERRED_ACCOUNT_PACKAGE: ${{ github.workspace }}/dist/examples/packages/mtc-preferred-account
        run: |
          cargo test --locked --all-features --test first_party_model_guard -- --ignored
          cargo test --locked --all-features --test first_party_preferred_account -- --ignored
          cargo test --locked --all-features --test first_party_soonest_reset -- --ignored
          cargo test --locked --all-features --lib soonest_reset_real_gateway -- --ignored
      - name: Record unsigned review archives after real host acceptance
        run: node scripts/example-publication.mjs review
      - name: Preserve review packages and the newly compiled policy binary
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: example-plugins-review-${{ github.sha }}
          path: |
            dist/examples/
          if-no-files-found: error
          retention-days: 90

  historical-host-compatibility:
    name: exact policy + guard on production host 469c6dd
    permissions:
      contents: read
      actions: read
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: example-plugins-review-${{ github.sha }}
          path: dist/examples
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: policy-rewrite-component-candidate-${{ github.sha }}
          path: .compat-components
      - name: Check out the immutable serving gateway source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: memeloop-online/memeloop-token-center
          ref: 469c6dd5aff4c46aa19ad7f60cb7baf9c699db62
          path: .historical-host
          persist-credentials: false
      - name: Check out the serving host's own immutable fixture
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: memeloop-online/memeloop-token-center-example-plugins
          ref: 21489f4fee6266de99fe7e258349468ce77af8bd
          path: .historical-host/.plugin-examples
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - name: Verify exact historical host and run actual large component requests
        env:
          MTC_EXAMPLE_PUBLICATION_ROOT: ${{ github.workspace }}/dist/examples/packages
          MTC_EXAMPLE_MODEL_GUARD_PACKAGE: ${{ runner.temp }}/historical-model-guard
          MTC_EXAMPLE_PRE_GROWTH_POLICY_COMPONENT: ${{ github.workspace }}/.compat-components/policy-rewrite-before-growth.wasm
        run: |
          test "$(git -C .historical-host rev-parse HEAD)" = 469c6dd5aff4c46aa19ad7f60cb7baf9c699db62
          cmp wit/token-center.wit .historical-host/wit/token-center.wit
          mkdir -p "$MTC_EXAMPLE_MODEL_GUARD_PACKAGE"
          cp plugin-sources/model-guard/plugin.json "$MTC_EXAMPLE_MODEL_GUARD_PACKAGE/plugin.json"
          cp .compat-components/model-guard.wasm "$MTC_EXAMPLE_MODEL_GUARD_PACKAGE/plugin.wasm"
          cp scripts/example-publication-host.rs .historical-host/tests/example_publication.rs
          mv .historical-host "$RUNNER_TEMP/historical-publication-host"
          cd "$RUNNER_TEMP/historical-publication-host"
          cargo test --locked --all-features --test example_publication

  publish:
    name: sign and clean-install ${{ matrix.package }}
    needs: [verify, historical-host-compatibility]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && github.ref_protected == true && github.repository == 'memeloop-online/memeloop-token-center-example-plugins'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [model-guard, preferred-account, soonest-reset, google-antigravity, policy-rewrite]
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
    env:
      REQUESTED_EXAMPLE_PACKAGE: ${{ matrix.package }}
    steps:
      - name: Check out the same reviewed master sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - name: Download this run's verified packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "example-plugins-review-$GITHUB_SHA" --dir dist/examples
      - name: Reverify official executable trust and metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/example-publication.mjs resolve
      - name: Check published official digests and select only the fixed package
        run: |
          node scripts/example-publication.mjs verify-pins
          node scripts/example-publication.mjs select
      - name: Install ORAS
        uses: oras-project/setup-oras@ccb71166b124a8452d1b72c4476398a909ed4d63
        with:
          version: 1.3.0
      - name: Log in with publication authority
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load the reviewed official installer and patched Cosign
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          docker pull "$INSTALLER_SOURCE@$INSTALLER_DIGEST"
          actual_revision=$(docker image inspect "$INSTALLER_SOURCE@$INSTALLER_DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          actual_cosign_label=$(docker image inspect "$INSTALLER_SOURCE@$INSTALLER_DIGEST" --format '{{index .Config.Labels "io.memeloop.cosign.version"}}')
          test "$actual_revision" = "$INSTALLER_SOURCE_REVISION"
          test "$actual_cosign_label" = "$COSIGN_VERSION"
          container=$(docker create "$INSTALLER_SOURCE@$INSTALLER_DIGEST")
          trap 'docker rm "$container" >/dev/null' EXIT
          mkdir -p "$RUNNER_TEMP/example-tools"
          docker cp "$container:/usr/local/bin/cosign" "$RUNNER_TEMP/example-tools/cosign"
          chmod 0555 "$RUNNER_TEMP/example-tools/cosign"
          actual_cosign=$("$RUNNER_TEMP/example-tools/cosign" version --json | node -e '
            let value=""; process.stdin.on("data", chunk => value += chunk);
            process.stdin.on("end", () => process.stdout.write(JSON.parse(value).gitVersion));')
          test "$actual_cosign" = "$COSIGN_VERSION"
          echo "$RUNNER_TEMP/example-tools" >> "$GITHUB_PATH"
      - name: Publish only the fixed package with exact MTC OCI media types
        run: node scripts/example-publication.mjs push
      - name: Sign and verify the exact new repository identity
        run: |
          cosign sign --yes "$PLUGIN_SOURCE@$PLUGIN_DIGEST"
          cosign verify --certificate-identity "$SIGNING_IDENTITY" \
            --certificate-oidc-issuer "$SIGNING_ISSUER" \
            "$PLUGIN_SOURCE@$PLUGIN_DIGEST" > "$RUNNER_TEMP/plugin-signature-verification.json"
          oras manifest fetch "$PLUGIN_SOURCE@$PLUGIN_DIGEST" --output "$RUNNER_TEMP/plugin-oci-manifest.json"
      - name: Clean-install signed bytes through the official installer
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$REGISTRY_USERNAME"
          test -n "$REGISTRY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/plugin-install" "$RUNNER_TEMP/plugin-registry"
          umask 077
          printf '%s' "$REGISTRY_USERNAME" > "$RUNNER_TEMP/plugin-registry/username"
          printf '%s' "$REGISTRY_PASSWORD" > "$RUNNER_TEMP/plugin-registry/password"
          sudo chown -R 10001:10001 "$RUNNER_TEMP/plugin-registry"
          sudo chown 10001:10001 "$RUNNER_TEMP/plugin-install"
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=32m \
            --mount "type=bind,src=$RUNNER_TEMP/plugin-install,dst=/plugins" \
            --mount "type=bind,src=$RUNNER_TEMP/plugin-registry,dst=/registry,readonly" \
            --entrypoint /usr/local/bin/install-plugin-oci "$INSTALLER_SOURCE@$INSTALLER_DIGEST" \
            "$PLUGIN_SOURCE@$PLUGIN_DIGEST" --plugin-dir /plugins --allowed-source "$PLUGIN_SOURCE" \
            --cosign-certificate-identity "$SIGNING_IDENTITY" \
            --cosign-certificate-oidc-issuer "$SIGNING_ISSUER" \
            --registry-username-file /registry/username --registry-password-file /registry/password \
            > "$RUNNER_TEMP/plugin-installation.json"
          node scripts/example-publication.mjs release
      - name: Publish immutable GitHub Release installation descriptor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release-descriptor.mjs
      - name: Preserve digest, signature, clean-install receipt and exact package
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: example-plugin-release-${{ matrix.package }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/plugin-release.json
            ${{ runner.temp }}/plugin-build.json
            ${{ runner.temp }}/plugin-push.json
            ${{ runner.temp }}/plugin-signature-verification.json
            ${{ runner.temp }}/plugin-oci-manifest.json
            ${{ runner.temp }}/plugin-installation.json
            ${{ runner.temp }}/plugin-install/${{ env.PLUGIN_ID }}/.mtc-oci-install.json
            ${{ runner.temp }}/plugin-package/
            release/examples-installer-trust.json
            release/examples-publication-metadata.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
