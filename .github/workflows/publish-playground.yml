name: publish signed playground plugin

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-text-playground
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master' && github.repository == 'memeloop-online/memeloop-token-center-example-plugins'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      PLUGIN_ID: mtc-text-playground
      PLUGIN_SOURCE: ghcr.io/memeloop-online/memeloop-token-center-text-playground-plugin
      SIGNING_IDENTITY: https://github.com/memeloop-online/memeloop-token-center-example-plugins/.github/workflows/publish-playground.yml@refs/heads/master
      SIGNING_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - name: Verify and build the self-contained UI package
        run: |
          node --test playground/agent-loop.test.mjs playground/test/ui-unit.test.mjs playground/test/release-evidence.test.mjs
          npm run build:playground
      - name: Resolve reviewed installer trust
        run: |
          node <<'NODE'
          const { appendFileSync, readFileSync } = require('node:fs');
          const trust = JSON.parse(readFileSync('release/playground-installer-trust.json', 'utf8'));
          if (trust.status !== 'ready'
              || trust.installer_repository !== 'ghcr.io/memeloop-online/memeloop-token-center-plugin-installer'
              || !/^https:\/\/github\.com\/memeloop-online\/memeloop-token-center\/actions\/runs\/[0-9]+$/.test(trust.installer_verification_run ?? '')
              || !/^sha256:[0-9a-f]{64}$/.test(trust.installer_digest ?? '')
              || !/^[0-9a-f]{40}$/.test(trust.installer_source_revision ?? '')
              || !/^[0-9a-f]{40}$/.test(trust.minimum_installer_contract_revision ?? '')) {
            throw new Error('plugin publication requires reviewed installer trust');
          }
          appendFileSync(process.env.GITHUB_ENV, [
            `INSTALLER_SOURCE=${trust.installer_repository}`,
            `INSTALLER_DIGEST=${trust.installer_digest}`,
            `INSTALLER_SOURCE_REVISION=${trust.installer_source_revision}`,
            `MINIMUM_INSTALLER_CONTRACT_REVISION=${trust.minimum_installer_contract_revision}`,
            `COSIGN_VERSION=${trust.cosign_version}`,
          ].join('\n') + '\n');
          NODE
      - name: Check out and verify compatible installer contract
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: memeloop-online/memeloop-token-center
          ref: ${{ env.INSTALLER_SOURCE_REVISION }}
          path: mtc-installer-contract
          fetch-depth: 0
          persist-credentials: false
      - name: Require the model-route action installer contract
        run: |
          test "$INSTALLER_SOURCE_REVISION" = "$(git -C mtc-installer-contract rev-parse HEAD)"
          git -C mtc-installer-contract merge-base --is-ancestor \
            "$MINIMUM_INSTALLER_CONTRACT_REVISION" "$INSTALLER_SOURCE_REVISION"
      - name: Install ORAS
        uses: oras-project/setup-oras@ccb71166b124a8452d1b72c4476398a909ed4d63 # main (reviewed immutable commit)
        with:
          version: 1.3.0
      - name: Require workflow registry authority
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$REGISTRY_TOKEN"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the reviewed installer and Cosign
        run: |
          docker pull "$INSTALLER_SOURCE@$INSTALLER_DIGEST"
          actual_revision=$(docker image inspect "$INSTALLER_SOURCE@$INSTALLER_DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          actual_cosign_label=$(docker image inspect "$INSTALLER_SOURCE@$INSTALLER_DIGEST" --format '{{index .Config.Labels "io.memeloop.cosign.version"}}')
          test "$actual_revision" = "$INSTALLER_SOURCE_REVISION"
          test "$actual_cosign_label" = "$COSIGN_VERSION"
          container=$(docker create "$INSTALLER_SOURCE@$INSTALLER_DIGEST")
          trap 'docker rm "$container" >/dev/null' EXIT
          mkdir -p "$RUNNER_TEMP/plugin-tools"
          docker cp "$container:/usr/local/bin/cosign" "$RUNNER_TEMP/plugin-tools/cosign"
          chmod 0555 "$RUNNER_TEMP/plugin-tools/cosign"
          actual_cosign=$("$RUNNER_TEMP/plugin-tools/cosign" version --json | node -e '
            let value=""; process.stdin.on("data", chunk => value += chunk);
            process.stdin.on("end", () => process.stdout.write(JSON.parse(value).gitVersion));')
          test "$actual_cosign" = "$COSIGN_VERSION"
          echo "$RUNNER_TEMP/plugin-tools" >> "$GITHUB_PATH"
      - name: Assemble the exact built package
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-package"
          cp -R dist/playground/mtc-text-playground/. "$RUNNER_TEMP/plugin-package/"
          printf '{"format_version":1}\n' > "$RUNNER_TEMP/plugin-package/config.json"
      - name: Publish exact MTC OCI media types
        working-directory: ${{ runner.temp }}/plugin-package
        run: |
          oras push "$PLUGIN_SOURCE:sha-$GITHUB_SHA" \
            --artifact-type application/vnd.memeloop.token-center.plugin.v1 \
            --config config.json:application/vnd.memeloop.token-center.plugin.config.v1+json \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            plugin.json:application/vnd.memeloop.token-center.plugin.manifest.v1+json \
            README.md:application/vnd.memeloop.token-center.plugin.asset.v1 \
            LICENSE:application/vnd.memeloop.token-center.plugin.asset.v1 \
            THIRD_PARTY_NOTICES.md:application/vnd.memeloop.token-center.plugin.asset.v1 \
            ui/playground.mjs:application/vnd.memeloop.token-center.plugin.asset.v1 \
            --format json > "$RUNNER_TEMP/plugin-push.json"
          digest=$(node -e '
            const value = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (!/^sha256:[0-9a-f]{64}$/.test(value.digest)) process.exit(1);
            process.stdout.write(value.digest);' "$RUNNER_TEMP/plugin-push.json")
          echo "PLUGIN_DIGEST=$digest" >> "$GITHUB_ENV"
      - name: Sign and verify the exact workflow identity
        run: |
          cosign sign --yes "$PLUGIN_SOURCE@$PLUGIN_DIGEST"
          cosign verify \
            --certificate-identity "$SIGNING_IDENTITY" \
            --certificate-oidc-issuer "$SIGNING_ISSUER" \
            "$PLUGIN_SOURCE@$PLUGIN_DIGEST" > "$RUNNER_TEMP/plugin-signature-verification.json"
          oras manifest fetch "$PLUGIN_SOURCE@$PLUGIN_DIGEST" \
            --output "$RUNNER_TEMP/plugin-oci-manifest.json"
      - name: Reinstall signed bytes with the official MTC installer
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$REGISTRY_USERNAME"
          test -n "$REGISTRY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/plugin-install" "$RUNNER_TEMP/plugin-registry"
          umask 077
          printf '%s' "$REGISTRY_USERNAME" > "$RUNNER_TEMP/plugin-registry/username"
          printf '%s' "$REGISTRY_PASSWORD" > "$RUNNER_TEMP/plugin-registry/password"
          sudo chown -R 10001:10001 "$RUNNER_TEMP/plugin-registry"
          sudo chown 10001:10001 "$RUNNER_TEMP/plugin-install"
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=32m \
            --mount "type=bind,src=$RUNNER_TEMP/plugin-install,dst=/plugins" \
            --mount "type=bind,src=$RUNNER_TEMP/plugin-registry,dst=/registry,readonly" \
            --entrypoint /usr/local/bin/install-plugin-oci \
            "$INSTALLER_SOURCE@$INSTALLER_DIGEST" \
            "$PLUGIN_SOURCE@$PLUGIN_DIGEST" \
            --plugin-dir /plugins \
            --allowed-source "$PLUGIN_SOURCE" \
            --cosign-certificate-identity "$SIGNING_IDENTITY" \
            --cosign-certificate-oidc-issuer "$SIGNING_ISSUER" \
            --registry-username-file /registry/username \
            --registry-password-file /registry/password \
            > "$RUNNER_TEMP/plugin-installation.json"
          node scripts/verify-playground-release.mjs "$RUNNER_TEMP"
      - name: Record production installation reference
        run: |
          {
            echo '## Signed playground package'
            echo "Reference: \`$PLUGIN_SOURCE@$PLUGIN_DIGEST\`"
            echo "Identity: \`$SIGNING_IDENTITY\`"
            echo "Issuer: \`$SIGNING_ISSUER\`"
            echo 'Official installer clean-install verified; download evidence before updating production trust.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve signed package and clean-install evidence
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: mtc-text-playground-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/plugin-release.json
            ${{ runner.temp }}/plugin-oci-manifest.json
            ${{ runner.temp }}/plugin-signature-verification.json
            ${{ runner.temp }}/plugin-installation.json
            ${{ runner.temp }}/plugin-package/
            ${{ runner.temp }}/plugin-install/mtc-text-playground/.mtc-oci-install.json
            dist/playground/package-evidence.json
            release/playground-installer-trust.json
          if-no-files-found: error
          retention-days: 90
