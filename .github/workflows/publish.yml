name: publish plugin

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-intelligence-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master' && github.ref_protected == true && github.repository == 'memeloop-online/memeloop-token-center-example-plugins'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
    permissions:
      contents: write
      packages: write
      id-token: write
      pages: write
    env:
      PLUGIN_ID: mtc-health-intelligence
      PLUGIN_SOURCE: ghcr.io/memeloop-online/memeloop-token-center-health-intelligence-plugin
      SIGNING_IDENTITY: https://github.com/memeloop-online/memeloop-token-center-example-plugins/.github/workflows/publish.yml@refs/heads/master
      SIGNING_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Verify and build the package
        run: npm run check
      - name: Set up pinned Rust component toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
      - name: Build and execute the real service-data component
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown -p mtc-health-component
          cargo run --locked --release -p health-componentize
          cargo run --locked --release -p health-host-harness --bin health-host-harness
          node scripts/verify-component.mjs
      - name: Collect the release API snapshot using the built collector
        run: npm run snapshot
      - name: Resolve reviewed installer trust
        run: |
          node scripts/verify-static.mjs
          node <<'NODE'
          const { appendFileSync, readFileSync } = require('node:fs');
          const trust = JSON.parse(readFileSync('release/installer-trust.json', 'utf8'));
          if (trust.status !== 'ready'
              || !/^sha256:[0-9a-f]{64}$/.test(trust.installer_digest ?? '')
              || !/^[0-9a-f]{40}$/.test(trust.installer_source_revision ?? '')
              || !/^[0-9a-f]{40}$/.test(trust.minimum_installer_contract_revision ?? '')) {
            throw new Error('plugin publication requires reviewed installer trust');
          }
          appendFileSync(process.env.GITHUB_ENV, [
            `INSTALLER_SOURCE=${trust.installer_repository}`,
            `INSTALLER_DIGEST=${trust.installer_digest}`,
            `INSTALLER_SOURCE_REVISION=${trust.installer_source_revision}`,
            `MINIMUM_INSTALLER_CONTRACT_REVISION=${trust.minimum_installer_contract_revision}`,
            `COSIGN_VERSION=${trust.cosign_version}`,
          ].join('\n') + '\n');
          NODE
      - name: Check out the pinned MTC host contract
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: memeloop-online/memeloop-token-center
          ref: 48231e8409528d10072d2ca695ea4a2657dc17c7
          path: mtc-core
          persist-credentials: false
      - name: Check out the pinned installer contract
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: memeloop-online/memeloop-token-center
          ref: 48231e8409528d10072d2ca695ea4a2657dc17c7
          path: mtc-installer-contract
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the install-time host contract
        run: |
          test "$INSTALLER_SOURCE_REVISION" = "$(git -C "$GITHUB_WORKSPACE/mtc-installer-contract" rev-parse HEAD)"
          git -C "$GITHUB_WORKSPACE/mtc-installer-contract" merge-base --is-ancestor \
            "$MINIMUM_INSTALLER_CONTRACT_REVISION" \
            "$INSTALLER_SOURCE_REVISION"
          node scripts/verify-static.mjs \
            "$GITHUB_WORKSPACE/mtc-core" \
            "$GITHUB_WORKSPACE/mtc-installer-contract"
          cargo run --locked --release -p health-host-harness --bin health-contract-verify -- \
            "$GITHUB_WORKSPACE/mtc-core" "$GITHUB_WORKSPACE/mtc-installer-contract"
      - name: Install ORAS
        uses: oras-project/setup-oras@ccb71166b124a8452d1b72c4476398a909ed4d63 # main (reviewed immutable commit)
        with:
          version: 1.3.0
      - name: Require workflow registry authority
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$REGISTRY_TOKEN"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the reviewed installer and Cosign
        run: |
          docker pull "$INSTALLER_SOURCE@$INSTALLER_DIGEST"
          actual_revision=$(docker image inspect "$INSTALLER_SOURCE@$INSTALLER_DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          actual_cosign_label=$(docker image inspect "$INSTALLER_SOURCE@$INSTALLER_DIGEST" --format '{{index .Config.Labels "io.memeloop.cosign.version"}}')
          test "$actual_revision" = "$INSTALLER_SOURCE_REVISION"
          test "$actual_cosign_label" = "$COSIGN_VERSION"
          container=$(docker create "$INSTALLER_SOURCE@$INSTALLER_DIGEST")
          trap 'docker rm "$container" >/dev/null' EXIT
          mkdir -p "$RUNNER_TEMP/plugin-tools"
          docker cp "$container:/usr/local/bin/cosign" "$RUNNER_TEMP/plugin-tools/cosign"
          chmod 0555 "$RUNNER_TEMP/plugin-tools/cosign"
          actual_cosign=$("$RUNNER_TEMP/plugin-tools/cosign" version --json | node -e '
            let value=""; process.stdin.on("data", chunk => value += chunk);
            process.stdin.on("end", () => process.stdout.write(JSON.parse(value).gitVersion));')
          test "$actual_cosign" = "$COSIGN_VERSION"
          echo "$RUNNER_TEMP/plugin-tools" >> "$GITHUB_PATH"
      - name: Assemble the signed component package
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-package"
          cp plugin.json plugin.wasm schemas-health-intelligence.json README.md LICENSE "$RUNNER_TEMP/plugin-package/"
          cp -R ui "$RUNNER_TEMP/plugin-package/"
          printf '{"format_version":1}\n' > "$RUNNER_TEMP/plugin-package/config.json"
      - name: Publish exact MTC OCI media types
        working-directory: ${{ runner.temp }}/plugin-package
        run: |
          oras push "$PLUGIN_SOURCE:sha-$GITHUB_SHA-run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --artifact-type application/vnd.memeloop.token-center.plugin.v1 \
            --config config.json:application/vnd.memeloop.token-center.plugin.config.v1+json \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            plugin.json:application/vnd.memeloop.token-center.plugin.manifest.v1+json \
            plugin.wasm:application/vnd.wasm.content.layer.v1+wasm \
            schemas-health-intelligence.json:application/vnd.memeloop.token-center.plugin.asset.v1 \
            README.md:application/vnd.memeloop.token-center.plugin.asset.v1 \
            LICENSE:application/vnd.memeloop.token-center.plugin.asset.v1 \
            ui/health-intelligence.mjs:application/vnd.memeloop.token-center.plugin.asset.v1 \
            --format json > "$RUNNER_TEMP/plugin-push.json"
          digest=$(node -e '
            const value = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (!/^sha256:[0-9a-f]{64}$/.test(value.digest)) process.exit(1);
            process.stdout.write(value.digest);' "$RUNNER_TEMP/plugin-push.json")
          echo "PLUGIN_DIGEST=$digest" >> "$GITHUB_ENV"
      - name: Sign and verify the exact workflow identity
        run: |
          cosign sign --yes "$PLUGIN_SOURCE@$PLUGIN_DIGEST"
          cosign verify \
            --certificate-identity "$SIGNING_IDENTITY" \
            --certificate-oidc-issuer "$SIGNING_ISSUER" \
            "$PLUGIN_SOURCE@$PLUGIN_DIGEST" > "$RUNNER_TEMP/plugin-signature-verification.json"
          oras manifest fetch "$PLUGIN_SOURCE@$PLUGIN_DIGEST" \
            --output "$RUNNER_TEMP/plugin-oci-manifest.json"
      - name: Reinstall signed bytes with the official MTC installer
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$REGISTRY_USERNAME"
          test -n "$REGISTRY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/plugin-install" "$RUNNER_TEMP/plugin-registry"
          umask 077
          printf '%s' "$REGISTRY_USERNAME" > "$RUNNER_TEMP/plugin-registry/username"
          printf '%s' "$REGISTRY_PASSWORD" > "$RUNNER_TEMP/plugin-registry/password"
          sudo chown -R 10001:10001 "$RUNNER_TEMP/plugin-registry"
          sudo chown 10001:10001 "$RUNNER_TEMP/plugin-install"
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=32m \
            --mount "type=bind,src=$RUNNER_TEMP/plugin-install,dst=/plugins" \
            --mount "type=bind,src=$RUNNER_TEMP/plugin-registry,dst=/registry,readonly" \
            --entrypoint /usr/local/bin/install-plugin-oci \
            "$INSTALLER_SOURCE@$INSTALLER_DIGEST" \
            "$PLUGIN_SOURCE@$PLUGIN_DIGEST" \
            --plugin-dir /plugins \
            --allowed-source "$PLUGIN_SOURCE" \
            --cosign-certificate-identity "$SIGNING_IDENTITY" \
            --cosign-certificate-oidc-issuer "$SIGNING_ISSUER" \
            --registry-username-file /registry/username \
            --registry-password-file /registry/password \
            > "$RUNNER_TEMP/plugin-installation.json"
          cmp "$RUNNER_TEMP/plugin-package/plugin.wasm" "$RUNNER_TEMP/plugin-install/$PLUGIN_ID/plugin.wasm"
          cmp "$RUNNER_TEMP/plugin-package/plugin.json" "$RUNNER_TEMP/plugin-install/$PLUGIN_ID/plugin.json"
          cmp "$RUNNER_TEMP/plugin-package/schemas-health-intelligence.json" "$RUNNER_TEMP/plugin-install/$PLUGIN_ID/schemas-health-intelligence.json"
          cmp "$RUNNER_TEMP/plugin-package/README.md" "$RUNNER_TEMP/plugin-install/$PLUGIN_ID/README.md"
          cmp "$RUNNER_TEMP/plugin-package/ui/health-intelligence.mjs" "$RUNNER_TEMP/plugin-install/$PLUGIN_ID/ui/health-intelligence.mjs"
          node scripts/verify-release.mjs "$RUNNER_TEMP"
      - name: Publish immutable GitHub Release installation descriptor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release-descriptor.mjs
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload the release API snapshot
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site
      - name: Deploy the release API snapshot
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Publish GitHub Release from the verified OCI and Pages inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tar -czf "$RUNNER_TEMP/mtc-health-intelligence-$version.tar.gz" -C "$RUNNER_TEMP/plugin-package" .
          tar -czf "$RUNNER_TEMP/health-intelligence-api-$version.tar.gz" -C site .
          cd "$RUNNER_TEMP"
          sha256sum "mtc-health-intelligence-$version.tar.gz" "health-intelligence-api-$version.tar.gz" > SHA256SUMS
          gh release upload "$PLUGIN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            "mtc-health-intelligence-$version.tar.gz" "health-intelligence-api-$version.tar.gz" \
            SHA256SUMS plugin-release.json plugin-oci-manifest.json plugin-signature-verification.json
      - name: Preserve release and clean-install evidence
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: mtc-health-intelligence-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/plugin-release.json
            ${{ runner.temp }}/plugin-oci-manifest.json
            ${{ runner.temp }}/plugin-signature-verification.json
            ${{ runner.temp }}/plugin-installation.json
            ${{ runner.temp }}/plugin-package/plugin.wasm
            component-build.json
            component-bounds.json
            Cargo.lock
            ${{ runner.temp }}/plugin-package/plugin.json
            ${{ runner.temp }}/plugin-package/schemas-health-intelligence.json
            ${{ runner.temp }}/plugin-package/README.md
            ${{ runner.temp }}/plugin-package/LICENSE
            ${{ runner.temp }}/plugin-package/ui/health-intelligence.mjs
            ${{ runner.temp }}/plugin-install/mtc-health-intelligence/.mtc-oci-install.json
          if-no-files-found: error
          retention-days: 90
