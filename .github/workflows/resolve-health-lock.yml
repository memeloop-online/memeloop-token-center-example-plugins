name: resolve health Wasmtime 48 lock
on:
  push:
    branches: [ci/health-wasmtime48-lock-20261021]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - name: Resolve only the requested runtime update
        run: |
          cargo update -p wasmtime --precise 48.0.7
          git diff --stat -- Cargo.lock > lock-metadata.txt
          sha256sum Cargo.lock >> lock-metadata.txt
          git rev-parse HEAD >> lock-metadata.txt
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: health-wasmtime48-lock-${{ github.sha }}
          path: |
            Cargo.lock
            lock-metadata.txt
          retention-days: 7
          if-no-files-found: error
