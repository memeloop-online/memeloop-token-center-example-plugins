[package]
name = "mtc-health-component"
version = "1.2.1"
edition = "2024"
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
wit-bindgen = { version = "=0.57.1", default-features = false, features = ["macros", "realloc", "bitflags", "macro-string"] }
